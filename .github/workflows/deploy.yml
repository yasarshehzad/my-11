name: Build and Deploy to Krystal Hosting

on:
  push:
    branches:
      - master

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🔧 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🧪 Run test suite
        run: npm test

      - name: 📘 Typecheck app & core tests
        run: npm run typecheck

      - name: 🧹 Run linter (full workspace)
        run: npm run lint -- --quiet

      - name: 🏗️ Build and Export (Static HTML)
        run: npm run build

      - name: ✅ Verify static export artifacts
        run: |
          test -f out/index.html
          test -f out/sw.js
          test -f out/.htaccess
          test -f out/data/player-bio-records.json
          test -f out/data/supplemental-2026-27.json
          test -f out/data/supplemental-archive.json
          ls -lh out/data/

      - name: 🚀 Deploy to Krystal via FTP
        id: deploy-1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ./
          timeout: 600000
          dangerous-clean-slate: false # Set to true if you want to wipe files not in the repo, but false is safer initially.

      - name: 🔁 Retry Deploy to Krystal via FTP (if first attempt timed out)
        if: steps.deploy-1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ./
          timeout: 600000
          dangerous-clean-slate: false

      - name: 🌐 Post-deploy HTTP health check
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL secret not set; skipping health check."
            exit 0
          fi
          curl -fsSI --retry 3 --retry-delay 5 "$SITE_URL"
